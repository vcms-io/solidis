name: Release

on:
  push:
    branches:
      - main
    paths:
      - 'package.json'

jobs:
  test:
    name: Test
    uses: ./.github/workflows/test.yaml

  check-version:
    name: Check Version
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract.outputs.version }}
      release: ${{ steps.check.outputs.release }}
      published: ${{ steps.check.outputs.published }}
      tagged: ${{ steps.check.outputs.tagged }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Extract Version
        id: extract
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Package version: $VERSION"

      - name: Check Package, Tag and Release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.extract.outputs.version }}"

          if [[ "$VERSION" == "0.0.0" ]]; then
            echo "release=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          NAME=$(node -p "require('./package.json').name")
          TAG="v$VERSION"
          PUBLISHED=false
          TAGGED=false
          RELEASED=false

          if [[ -n "$(npm view "$NAME@$VERSION" version 2> /dev/null)" ]]; then
            PUBLISHED=true
          fi

          git fetch --tags --force

          if git rev-parse --quiet --verify "refs/tags/$TAG" > /dev/null; then
            TAGGED=true
          fi

          if gh release view "$TAG" > /dev/null 2>&1; then
            RELEASED=true
          fi

          echo "Published: $PUBLISHED, tagged: $TAGGED, released: $RELEASED"
          echo "published=$PUBLISHED" >> $GITHUB_OUTPUT
          echo "tagged=$TAGGED" >> $GITHUB_OUTPUT

          if [[ "$PUBLISHED" == true && "$TAGGED" == true && "$RELEASED" == true ]]; then
            echo "release=false" >> $GITHUB_OUTPUT
          else
            echo "release=true" >> $GITHUB_OUTPUT
          fi

  release:
    name: Release Package
    needs: check-version

    if: needs.check-version.outputs.release == 'true'

    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.x"
          cache: "npm"
          registry-url: "https://registry.npmjs.org"

      - name: Install Dependencies
        run: npm ci

      - name: Build Package
        run: npm run build

      - name: Pack Package
        id: pack
        run: |
          TARBALL=$(npm pack --ignore-scripts)
          echo "tarball=$TARBALL" >> $GITHUB_OUTPUT

      - name: Verify Package
        run: npm run --silent node:ts ./scripts/workflows/release/verify.ts "${{ steps.pack.outputs.tarball }}"

      - name: Publish to NPM
        if: needs.check-version.outputs.published != 'true'
        run: npm publish "./${{ steps.pack.outputs.tarball }}" --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Push Tag
        if: needs.check-version.outputs.tagged != 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git tag -a "v${{ needs.check-version.outputs.version }}" -m "Release v${{ needs.check-version.outputs.version }}"
          git push origin "v${{ needs.check-version.outputs.version }}"

      - name: Extract Release Notes
        run: |
          VERSION="${{ needs.check-version.outputs.version }}"

          awk -v heading="## [$VERSION]" '
            index($0, heading) == 1 { found = 1; next }
            found && (/^## / || /^\[.*\]: /) { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md || true

          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::warning::CHANGELOG.md has no section for $VERSION, so the release only has generated notes."
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.check-version.outputs.version }}
          name: Release v${{ needs.check-version.outputs.version }}
          body_path: release-notes.md
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
