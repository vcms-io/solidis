name: Benchmark

on:
  push:
    branches: [main]
    paths:
      - 'sources/**'
      - 'scripts/benchmarks/**'
      - 'package-lock.json'
      - '.github/workflows/benchmark.yml'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/benchmarks/**'
      - '.github/workflows/benchmark.yml'

concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: ${{ matrix.case }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        case:
          - set
          - get
          - 'hash:HSET+HGET+HGETALL'
          - 'hash:HMSET+HMGET+HDEL'
          - 'set:SADD+SISMEMBER+SMEMBERS'
          - 'set:SADD+SISMEMBER+SREM'
          - 'expire:SET+EXPIRE+TTL'
          - 'nonTx:SETPX+GET'
          - 'list:LPUSH+RPUSH+LRANGE'
          - 'list:LPUSH+RPUSH+LPOP+RPOP+LLEN'
          - 'counter:INCR+DECR'
          - 'transaction:SET+EXPIRE+GET'
          - 'transactionMixed:SET+GET'
          - 'multiKey:MSET+MGET'
          - 'pipeline:SET+INCR+GET'
          - 'stream:XADD+XRANGE+XLEN'
          - 'zset:ZADD+ZRANGE+ZREM'
          - 'info:INFO+CONFIGGET'
          - 'pubsub:PUBLISH+MESSAGE'

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install Redis
        run: |
          curl -fsSL https://packages.redis.io/gpg | sudo gpg --dearmor -o /usr/share/keyrings/redis-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/redis-archive-keyring.gpg] https://packages.redis.io/deb $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/redis.list
          sudo apt-get update
          sudo apt-get install -y redis
          redis-server --daemonize yes
          redis-cli ping

      - run: npm ci

      - name: Run benchmark
        run: npm run benchmark:snapshot -- "${{ matrix.case }}"
        env:
          SOLIDIS_TEST_PORT: 6379
          SOLIDIS_BENCH_LIBRARIES: solidis,ioredis,iovalkey,node-redis,valkey-glide,speedkey

      - name: Upload snapshot
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-${{ strategy.job-index }}
          path: '*.benchmark'
          retention-days: 1

  merge:
    name: Merge & PR
    needs: benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - run: npm ci

      - name: Download all snapshots
        uses: actions/download-artifact@v8
        with:
          pattern: benchmark-*
          path: snapshots

      - name: Merge snapshots
        run: npm run benchmark:merge -- snapshots/**/*.benchmark -o benchmark-report.md -s merged.benchmark --summary benchmark-summary.md

      - name: Attach the report to the job summary
        run: cat benchmark-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Check if PR should be created
        id: check
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "pr=true" >> "$GITHUB_OUTPUT"
          else
            echo "pr=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Update README files
        if: steps.check.outputs.pr == 'true'
        run: npm run benchmark:replace:readme -- merged.benchmark

      - name: Update website benchmark data
        if: steps.check.outputs.pr == 'true'
        run: npm run benchmark:replace:website -- merged.benchmark

      - name: Lint and format
        if: steps.check.outputs.pr == 'true'
        run: npm run lint

      - name: Write the pull request body
        if: steps.check.outputs.pr == 'true'
        run: |
          {
            echo 'Automated benchmark update triggered by source or dependency changes on `main`. Every benchmark case ran in its own job; the merged results replace the benchmark section of every `README*.md` and the website data in `website/lib/benchmarks.ts`.'
            echo
            cat benchmark-summary.md
          } > benchmark-pull-request.md

      - name: Create pull request
        if: steps.check.outputs.pr == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'docs: update benchmark results'
          branch: benchmark/update-results
          delete-branch: true
          title: 'docs: update benchmark results'
          body-path: benchmark-pull-request.md
          labels: benchmark,automated
